# Purpose: Deploy and apply the Apache configuration through GitHub Actions.
name:	Deploy Apache Config
on:
  push:
    branches:	[main]
jobs:
  deploy:
    runs-on:	self-hosted
    steps:
      - uses:	actions/checkout@v4
      - name:	Dry	run	(check	+	diff)
        run:	ansible-playbook	-i	inventory/hosts.ini	site.yml	--check	--diff
      - name:	Apply	to	production
        run:	ansible-playbook	-i	inventory/hosts.ini	site.yml